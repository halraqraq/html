<!DOCTYPE html>

  <title>Path Finder BH - Browse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    .header { background-color: #ff0000; height: 60px; width: 100%; }

    .result-box { background-color: #e0e0e0; height: 40px; border-radius: 20px; width: 100%; }
    .navbar { background-color: #ff0000; height: 60px; display: flex; justify-content: space-around; align-items: center; width: 100%; margin-top: auto; }
    .navbar a { color: white; text-decoration: none; font-size: 14px; }
  </style>
</head>

      <select class="search-select">
