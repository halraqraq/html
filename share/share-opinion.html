<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Path Finder BH - Write Opinion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
    .header { background-color: #ff0000; height: 60px; width: 100%; }
    .container { flex: 1; max-width: 480px; margin: 0 auto; width: 100%; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 10px; }
    .field { background-color: #dcdcdc; border: none; padding: 12px 15px; border-radius: 20px; width: 100%; font-size: 13px; outline: none; }
    textarea.field { height: 120px; border-radius: 25px; resize: none; }
    .btn-group { display: flex; gap: 15px; margin-top: 10px; }
    .form-btn { flex: 1; padding: 12px; border-radius: 20px; border: none; background-color: #dcdcdc; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none; color: black; }
    .navbar { background-color: #ff0000; height: 60px; display: flex; justify-content: space-around; align-items: center; width: 100%; margin-top: auto; }
  </style>
</head>
<body>

  <header class="header"></header>

  <main class="container">
    <div class="row">
      <input type="text" class="field" placeholder="Your status">
      <input type="text" class="field" placeholder="Study year / graduation year">
    </div>

    <input type="text" class="field" placeholder="Hardest part?">
    <input type="text" class="field" placeholder="Study nature (theory/practical, projects/exams...)">
    <input type="text" class="field" placeholder="Job market — what do graduates you know work as?">
    <textarea class="field" placeholder="Your advice for a student considering this major *"></textarea>

    <div class="btn-group">
      <button type="button" class="form-btn">send</button>
      <a href="opinions.html" class="form-btn">cancel</a>
    </div>
  </main>

  <nav class="navbar"></nav>

</body>
</html>
